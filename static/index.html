<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f1">
  <title>Budget</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Budget home"><span class="brand-mark">B</span><span>Budget</span></a>
    <nav id="navigation" class="navigation" aria-label="Main navigation" hidden>
      <a href="#budget" data-view="budget" data-i18n="navBudget"></a>
      <a id="users-link" href="#users" data-view="users" data-i18n="navUsers" hidden></a>
      <a id="categories-link" href="#categories" data-view="categories" data-i18n="navCategories" hidden></a>
      <a href="#report" data-view="report" data-i18n="navReport"></a>
    </nav>
    <div class="top-actions">
      <button id="language-button" class="icon-button language-button" type="button" aria-label="Change language" title="Change language"><svg><use href="#i-globe"></use></svg><span id="language-code">FR</span></button>
      <button id="logout-button" class="icon-button" type="button" aria-label="Sign out" title="Sign out" hidden><svg><use href="#i-logout"></use></svg></button>
    </div>
  </header>

  <main>
    <p id="app-error" class="error-message" role="alert" hidden></p>
    <section id="login-view" class="login-layout" hidden>
      <div class="login-art" aria-hidden="true">
        <div class="art-orbit orbit-one"></div><div class="art-orbit orbit-two"></div>
        <div class="art-card"><span class="art-amount">$<span>····</span></span><span class="art-line"></span><span class="art-line short"></span><span class="art-circles"><i></i><i></i><i></i></span></div>
        <span class="art-sparkle sparkle-one">✳</span><span class="art-sparkle sparkle-two">✳</span>
      </div>
      <div class="login-panel">
        <form id="login-form" class="form-stack">
          <label for="email" data-i18n="email"></label>
          <input id="email" name="email" type="email" autocomplete="username" required maxlength="254">
          <label for="password" data-i18n="password"></label>
          <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
          <p id="login-error" class="error-message" role="alert" hidden></p>
          <button class="primary-button icon-submit" type="submit" aria-label="Sign in" title="Sign in"><svg><use href="#i-arrow"></use></svg></button>
        </form>
      </div>
    </section>

    <section id="budget-view" hidden>
      <div class="page-heading">
        <div><h1 data-i18n="budgetTitle"></h1><p id="budget-error" class="error-message" role="alert" hidden></p></div>
      </div>
      <section class="panel transactions-panel">
        <div class="table-wrap"><table><thead><tr>
          <th aria-sort="ascending"><button class="budget-sort-button" type="button" data-budget-sort="spent_on"><span data-i18n="date"></span><span class="sort-indicator" aria-hidden="true">↑</span></button></th>
          <th aria-sort="none"><button class="budget-sort-button" type="button" data-budget-sort="supplier"><span data-i18n="merchant"></span><span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th aria-sort="none"><button class="budget-sort-button" type="button" data-budget-sort="category"><span data-i18n="category"></span><span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th aria-sort="none"><button class="budget-sort-button" type="button" data-budget-sort="amount"><span data-i18n="amount"></span><span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th aria-sort="none"><button class="budget-sort-button" type="button" data-budget-sort="paid_by"><span data-i18n="payer"></span><span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th aria-sort="none"><button class="budget-sort-button" type="button" data-budget-sort="transfer_to"><span data-i18n="transferTo"></span><span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th aria-sort="none"><button class="budget-sort-button" type="button" data-budget-sort="description"><span data-i18n="description"></span><span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th data-i18n="actions"></th>
        </tr><tr class="table-filters">
          <th><label class="sr-only" for="budget-month-filter" data-i18n="month"></label><select id="budget-month-filter" data-month-filter></select></th>
          <th><input aria-label="Filter merchant" data-search-field="filter_supplier"></th>
          <th><label class="sr-only" for="budget-category-filter" data-i18n="category"></label><select id="budget-category-filter" data-search-field="filter_category"></select></th>
          <th><input aria-label="Filter amount" data-search-field="filter_amount" inputmode="decimal"></th>
          <th><label class="sr-only" for="budget-payer-filter" data-i18n="filterPayer"></label><select id="budget-payer-filter" data-search-field="filter_paid_by"></select></th>
          <th><label class="sr-only" for="budget-recipient-filter" data-i18n="filterRecipient"></label><select id="budget-recipient-filter" data-search-field="filter_transfer_to"></select></th>
          <th><input aria-label="Filter description" data-search-field="filter_description"></th>
          <th><button id="clear-filters-button" class="icon-button filter-clear-button" type="button" data-i18n-aria-label="clearFilters" data-i18n-title="clearFilters"><svg><use href="#i-close"></use></svg></button></th>
        </tr></thead><tbody id="expense-rows"></tbody>
        <tfoot id="expense-total-row"><tr><td colspan="3" class="total-label-cell" data-i18n="selectionTotal"></td><td id="expense-total" class="amount-cell"></td><td colspan="4"></td></tr></tfoot></table>
        <p id="empty-state" class="empty-state" role="status" hidden></p></div>
        <div class="table-footer"><span id="page-status"></span><div class="pagination"><button id="previous-page" class="icon-button" type="button" aria-label="Previous page" title="Previous page"><svg><use href="#i-chevron-left"></use></svg></button><button id="next-page" class="icon-button" type="button" aria-label="Next page" title="Next page"><svg><use href="#i-chevron-right"></use></svg></button></div><button id="add-expense-button" class="icon-button primary-button" type="button" data-i18n-aria-label="addExpense" data-i18n-title="addExpenseTooltip"><svg><use href="#i-plus"></use></svg></button></div>
      </section>
    </section>

    <section id="categories-view" hidden>
      <div class="page-heading"><div><h1 data-i18n="categoriesTitle"></h1><p id="categories-page-error" class="error-message" role="alert" hidden></p></div></div>
      <section class="panel category-manager">
        <div class="table-wrap"><table class="category-table"><thead><tr>
          <th aria-sort="ascending"><button class="category-sort-button" type="button" data-category-sort="name_en"><span data-i18n="categoryEnglish"></span><span class="sort-indicator" aria-hidden="true">↑</span></button></th>
          <th aria-sort="none"><button class="category-sort-button" type="button" data-category-sort="name_fr"><span data-i18n="categoryFrench"></span><span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th class="usage-count-cell" aria-sort="none"><button class="category-sort-button" type="button" data-category-sort="usage_count"><span data-i18n="usageCount"></span><span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th data-i18n="actions"></th>
        </tr><tr class="table-filters category-filters">
          <th><input id="category-filter-en" type="search" data-i18n-placeholder="filterEnglishCategory" data-i18n-aria-label="filterEnglishCategory"></th>
          <th><input id="category-filter-fr" type="search" data-i18n-placeholder="filterFrenchCategory" data-i18n-aria-label="filterFrenchCategory"></th>
          <th></th>
          <th><button id="clear-category-filters" class="icon-button filter-clear-button" type="button" data-i18n-aria-label="clearFilters" data-i18n-title="clearFilters"><svg><use href="#i-close"></use></svg></button></th>
        </tr></thead><tbody id="category-table-body"></tbody></table></div>
        <div class="table-footer"><span id="category-count"></span><button id="add-category-button" class="icon-button primary-button" type="button" data-i18n-aria-label="addCategory" data-i18n-title="addCategory"><svg><use href="#i-plus"></use></svg></button></div>
      </section>
      <dialog id="category-dialog" class="expense-dialog category-dialog">
        <div class="panel-heading category-dialog-heading"><h2 id="category-form-title" data-i18n="addCategory"></h2><button id="close-category-dialog" class="icon-button" type="button" data-i18n-aria-label="close" data-i18n-title="close"><svg><use href="#i-close"></use></svg></button></div>
        <form id="category-form" class="form-stack">
          <label for="category-en" data-i18n="categoryEnglish"></label><input id="category-en" required maxlength="100">
          <label for="category-fr" data-i18n="categoryFrench"></label><input id="category-fr" required maxlength="100">
          <p id="category-error" class="error-message" role="alert" hidden></p>
          <button id="category-submit" class="primary-button icon-submit" type="submit" data-i18n-aria-label="saveCategory" data-i18n-title="saveCategory"><svg><use href="#i-check"></use></svg></button>
        </form>
      </dialog>
    </section>

    <section id="report-view" hidden>
      <div class="page-heading"><div><h1 data-i18n="reportTitle"></h1></div></div>
      <section class="panel report-filters-panel">
        <div class="table-wrap"><table class="report-filters-table"><thead><tr>
          <th data-i18n="year"></th>
          <th data-i18n="month"></th>
          <th data-i18n="category"></th>
          <th data-i18n="payer"></th>
          <th></th>
        </tr><tr class="table-filters">
          <th><label class="sr-only" for="report-year-filter" data-i18n="year"></label><select id="report-year-filter" data-filter="year"></select></th>
          <th><label class="sr-only" for="report-month-filter" data-i18n="month"></label><select id="report-month-filter" data-month-filter></select></th>
          <th><label class="sr-only" for="report-category-filter" data-i18n="category"></label><select id="report-category-filter" data-filter="category"></select></th>
          <th><label class="sr-only" for="report-payer-filter" data-i18n="payer"></label><select id="report-payer-filter" data-filter="payer"></select></th>
          <th><button id="clear-report-filters" class="icon-button filter-clear-button" type="button" data-i18n-aria-label="clearFilters" data-i18n-title="clearFilters"><svg><use href="#i-close"></use></svg></button></th>
        </tr></thead></table></div>
      </section>
      <div class="summary-grid">
        <article class="summary-card total-card"><div class="card-label"><span data-i18n="totalSpent"></span><span class="card-icon"><svg><use href="#i-coins"></use></svg></span></div><strong id="total-spent">—</strong><span class="card-foot" data-i18n="filteredTotal"></span></article>
        <article class="summary-card"><div class="card-label"><span data-i18n="transactions"></span><span class="card-icon lavender"><svg><use href="#i-receipt"></use></svg></span></div><strong id="transaction-count">—</strong><span class="card-foot" data-i18n="matchingRecords"></span></article>
        <article class="summary-card"><div class="card-label"><span data-i18n="averageExpense"></span><span class="card-icon peach"><svg><use href="#i-chart"></use></svg></span></div><strong id="average-expense">—</strong><span class="card-foot" data-i18n="perTransaction"></span></article>
      </div>
      <div class="content-grid">
        <section class="panel category-panel"><div class="panel-heading"><div><p class="eyebrow" data-i18n="spendingBreakdown"></p><h2 data-i18n="byCategory"></h2></div><svg class="heading-icon"><use href="#i-chart"></use></svg></div><div id="category-chart" class="category-chart"></div></section>
        <section class="panel monthly-panel"><div class="panel-heading"><div><p class="eyebrow" data-i18n="recentActivity"></p><h2 data-i18n="monthlySpending"></h2></div><svg class="heading-icon"><use href="#i-calendar"></use></svg></div><div id="monthly-chart" class="monthly-chart"></div></section>
      </div>
    </section>

    <dialog id="expense-dialog" class="expense-dialog">
      <form id="expense-form" class="form-stack">
        <div class="panel-heading"><h2 id="expense-form-title" data-i18n="addExpense"></h2><button id="close-expense-dialog" class="icon-button" type="button" data-i18n-aria-label="close" data-i18n-title="close"><svg><use href="#i-close"></use></svg></button></div>
        <label for="expense-date" data-i18n="date"></label><input id="expense-date" name="spent_on" type="text" inputmode="numeric" placeholder="yyyy-mm-dd" pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}" required maxlength="10">
        <label for="expense-supplier" data-i18n="merchant"></label><input id="expense-supplier" name="supplier" maxlength="200">
        <label for="expense-category" data-i18n="category"></label><select id="expense-category" name="category"></select>
        <label for="expense-amount" data-i18n="amount"></label><input id="expense-amount" name="amount" type="number" step="0.01" required>
        <label for="expense-payer" data-i18n="payer"></label><select id="expense-payer" name="paid_by"><option value="" data-i18n="selectMember"></option></select>
        <label for="expense-recipient" data-i18n="transferTo"></label><select id="expense-recipient" name="transfer_to"><option value="" data-i18n="selectMember"></option></select>
        <label for="expense-description" data-i18n="description"></label><input id="expense-description" name="description" maxlength="2500">
        <p id="expense-error" class="error-message" role="alert" hidden></p>
        <button class="primary-button icon-submit" type="submit" aria-label="Save expense" title="Save expense"><svg><use href="#i-check"></use></svg></button>
      </form>
    </dialog>

    <section id="users-view" hidden>
      <div class="page-heading"><div><h1 data-i18n="usersTitle"></h1></div></div>
      <section class="panel users-list-panel">
        <div class="table-wrap"><table class="users-table"><thead><tr>
          <th data-i18n="name"></th><th data-i18n="email"></th><th data-i18n="accountType"></th><th class="usage-count-cell" data-i18n="usageCount"></th><th data-i18n="actions"></th>
        </tr></thead><tbody id="users-table-body"></tbody></table></div>
        <div class="table-footer"><span id="user-count"></span><button id="add-user-button" class="icon-button primary-button" type="button" data-i18n-aria-label="addUser" data-i18n-title="addUser"><svg><use href="#i-plus"></use></svg></button></div>
      </section>
      <dialog id="user-dialog" class="expense-dialog user-dialog">
        <div class="panel-heading user-dialog-heading"><h2 id="user-form-title" data-i18n="addUser"></h2><button id="close-user-dialog" class="icon-button" type="button" data-i18n-aria-label="close" data-i18n-title="close"><svg><use href="#i-close"></use></svg></button></div>
          <form id="user-form" class="form-stack">
            <label for="person-name" data-i18n="name"></label><input id="person-name" name="name" required maxlength="200">
            <label class="account-only" for="user-email" data-i18n="email"></label><input class="account-only" id="user-email" name="email" type="email" autocomplete="email" maxlength="254">
            <label class="account-only" for="user-admin" data-i18n="accountType"></label><select class="account-only" id="user-admin" name="is_admin"><option value="" data-i18n="noAccount"></option><option value="false" data-i18n="user"></option><option value="true" data-i18n="administrator"></option></select>
            <label class="account-only" for="user-password" data-i18n="password"></label><input class="account-only" id="user-password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128">
            <p id="user-password-hint" class="field-hint account-only" data-i18n="accountDetailsOptional"></p><p id="user-error" class="error-message" role="alert" hidden></p>
            <button id="user-submit" class="primary-button icon-submit" type="submit" aria-label="Create account" title="Create account"><svg><use href="#i-plus"></use></svg></button>
          </form>
      </dialog>
    </section>

  </main>
  <footer><span>© <span id="current-year"></span> Budget</span></footer>

  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></symbol>
    <symbol id="i-coins" viewBox="0 0 24 24"><ellipse cx="9" cy="6" rx="6" ry="3"/><path d="M3 6v5c0 1.7 2.7 3 6 3 1 0 2-.1 2.8-.4M3 11v5c0 1.7 2.7 3 6 3 .5 0 1 0 1.5-.1M15 10c3.3 0 6 1.3 6 3s-2.7 3-6 3-6-1.3-6-3 2.7-3 6-3Zm-6 3v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></symbol>
    <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-4 2-4-2-3 2V3Z M9 8h6M9 12h6M9 16h3"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 19V5m0 14h17M8 15l4-4 3 2 5-6"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18m-13 4h3m-3 3h6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-user-plus" viewBox="0 0 24 24"><path d="M15 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m8-10a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm10-3v6m-3-3h6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14m-7-7h14"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2m6-10a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm10 10v-2a4 4 0 0 0-3-3.9m-1-12a4 4 0 0 1 0 7.8"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18m-2 0-.9 14H5.9L5 6m4 0V4h6v2m-5 4v6m4-6v6"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  </svg>
  <script src="/static/app.js" defer></script>
</body>
</html>
