<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f1">
  <title>Budget</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Budget home"><span class="brand-mark">B</span><span>budget<span class="brand-dot">.</span></span></a>
    <nav id="navigation" class="navigation" aria-label="Main navigation" hidden>
      <a href="#budget" data-view="budget" data-i18n="navBudget"></a>
      <a id="users-link" href="#users" data-view="users" data-i18n="navUsers" hidden></a>
    </nav>
    <div class="top-actions">
      <button id="language-button" class="icon-button language-button" type="button" aria-label="Change language" title="Change language"><svg><use href="#i-globe"></use></svg><span id="language-code">FR</span></button>
      <button id="logout-button" class="icon-button" type="button" aria-label="Sign out" title="Sign out" hidden><svg><use href="#i-logout"></use></svg></button>
    </div>
  </header>

  <main>
    <p id="app-error" class="error-message" role="alert" hidden></p>
    <section id="login-view" class="login-layout" hidden>
      <div class="login-art" aria-hidden="true">
        <div class="art-orbit orbit-one"></div><div class="art-orbit orbit-two"></div>
        <div class="art-card"><span class="art-caption">YOUR MONEY, IN FOCUS</span><span class="art-amount">$<span>····</span></span><span class="art-line"></span><span class="art-line short"></span><span class="art-circles"><i></i><i></i><i></i></span></div>
        <span class="art-sparkle sparkle-one">✳</span><span class="art-sparkle sparkle-two">✳</span>
      </div>
      <div class="login-panel">
        <p class="eyebrow" data-i18n="privateSpace"></p>
        <h1 data-i18n="welcome"></h1>
        <p class="subheading" data-i18n="signInPrompt"></p>
        <form id="login-form" class="form-stack">
          <label for="email" data-i18n="email"></label>
          <input id="email" name="email" type="email" autocomplete="username" required maxlength="254">
          <label for="password" data-i18n="password"></label>
          <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
          <p id="login-error" class="error-message" role="alert" hidden></p>
          <button class="primary-button icon-submit" type="submit" aria-label="Sign in" title="Sign in"><svg><use href="#i-arrow"></use></svg></button>
        </form>
        <p class="login-note"><svg><use href="#i-lock"></use></svg><span data-i18n="privateNote"></span></p>
      </div>
    </section>

    <section id="budget-view" hidden>
      <div class="page-heading">
        <div><p class="eyebrow" data-i18n="overview"></p><h1 data-i18n="budgetTitle"></h1><p class="subheading" data-i18n="budgetSubtitle"></p></div>
        <div class="filter-row">
          <label class="sr-only" for="year-filter" data-i18n="year"></label><select id="year-filter"></select>
          <label class="sr-only" for="category-filter" data-i18n="category"></label><select id="category-filter"></select>
          <label class="sr-only" for="payer-filter" data-i18n="payer"></label><select id="payer-filter"></select>
        </div>
      </div>
      <div class="summary-grid">
        <article class="summary-card total-card"><div class="card-label"><span data-i18n="totalSpent"></span><span class="card-icon"><svg><use href="#i-coins"></use></svg></span></div><strong id="total-spent">—</strong><span class="card-foot" data-i18n="filteredTotal"></span></article>
        <article class="summary-card"><div class="card-label"><span data-i18n="transactions"></span><span class="card-icon lavender"><svg><use href="#i-receipt"></use></svg></span></div><strong id="transaction-count">—</strong><span class="card-foot" data-i18n="matchingRecords"></span></article>
        <article class="summary-card"><div class="card-label"><span data-i18n="averageExpense"></span><span class="card-icon peach"><svg><use href="#i-chart"></use></svg></span></div><strong id="average-expense">—</strong><span class="card-foot" data-i18n="perTransaction"></span></article>
      </div>
      <div class="content-grid">
        <section class="panel category-panel"><div class="panel-heading"><div><p class="eyebrow" data-i18n="spendingBreakdown"></p><h2 data-i18n="byCategory"></h2></div><svg class="heading-icon"><use href="#i-chart"></use></svg></div><div id="category-chart" class="category-chart"></div></section>
        <section class="panel monthly-panel"><div class="panel-heading"><div><p class="eyebrow" data-i18n="recentActivity"></p><h2 data-i18n="monthlySpending"></h2></div><svg class="heading-icon"><use href="#i-calendar"></use></svg></div><div id="monthly-chart" class="monthly-chart"></div></section>
      </div>
      <section class="panel transactions-panel">
        <div class="panel-heading transaction-heading">
          <div><p class="eyebrow" data-i18n="ledger"></p><h2 data-i18n="budgetTitle"></h2></div>
          <label class="search-box"><svg><use href="#i-search"></use></svg><span class="sr-only" data-i18n="search"></span><input id="search-filter" type="search" data-i18n-placeholder="searchPlaceholder" maxlength="200"></label>
        </div>
        <div class="table-wrap"><table><thead><tr>
          <th data-i18n="date"></th><th data-i18n="amount"></th><th data-i18n="category"></th><th data-i18n="merchant"></th><th data-i18n="description"></th><th data-i18n="payer"></th><th data-i18n="transferTo"></th><th data-i18n="comments"></th>
        </tr></thead><tbody id="expense-rows"></tbody></table>
        <p id="empty-state" class="empty-state" role="status" hidden></p></div>
        <div class="table-footer"><span id="page-status"></span><div class="pagination"><button id="previous-page" class="icon-button" type="button" aria-label="Previous page" title="Previous page"><svg><use href="#i-chevron-left"></use></svg></button><button id="next-page" class="icon-button" type="button" aria-label="Next page" title="Next page"><svg><use href="#i-chevron-right"></use></svg></button></div></div>
      </section>
    </section>

    <section id="users-view" hidden>
      <div class="page-heading"><div><p class="eyebrow" data-i18n="accountAccess"></p><h1 data-i18n="usersTitle"></h1><p class="subheading" data-i18n="usersSubtitle"></p></div></div>
      <div class="users-layout">
        <section class="panel user-form-panel"><div class="panel-heading"><div><p class="eyebrow" data-i18n="newAccount"></p><h2 data-i18n="addUser"></h2></div><span class="card-icon"><svg><use href="#i-user-plus"></use></svg></span></div>
          <form id="user-form" class="form-stack">
            <label for="first-name" data-i18n="firstName"></label><input id="first-name" name="first_name" autocomplete="given-name" required maxlength="100">
            <label for="last-name" data-i18n="lastName"></label><input id="last-name" name="last_name" autocomplete="family-name" required maxlength="100">
            <label for="user-email" data-i18n="email"></label><input id="user-email" name="email" type="email" autocomplete="email" required maxlength="254">
            <label for="user-password" data-i18n="password"></label><input id="user-password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
            <p class="field-hint" data-i18n="passwordHint"></p><p id="user-error" class="error-message" role="alert" hidden></p>
            <button class="primary-button icon-submit" type="submit" aria-label="Create account" title="Create account"><svg><use href="#i-plus"></use></svg></button>
          </form>
        </section>
        <section class="panel users-list-panel"><div class="panel-heading"><div><p class="eyebrow" data-i18n="accessList"></p><h2 data-i18n="usersTitle"></h2></div><svg class="heading-icon"><use href="#i-users"></use></svg></div><div id="users-list" class="users-list"></div></section>
      </div>
    </section>
  </main>
  <footer><span>© <span id="current-year"></span> budget<span class="brand-dot">.</span></span><span data-i18n="footerNote"></span></footer>

  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></symbol>
    <symbol id="i-coins" viewBox="0 0 24 24"><ellipse cx="9" cy="6" rx="6" ry="3"/><path d="M3 6v5c0 1.7 2.7 3 6 3 1 0 2-.1 2.8-.4M3 11v5c0 1.7 2.7 3 6 3 .5 0 1 0 1.5-.1M15 10c3.3 0 6 1.3 6 3s-2.7 3-6 3-6-1.3-6-3 2.7-3 6-3Zm-6 3v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></symbol>
    <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-4 2-4-2-3 2V3Z M9 8h6M9 12h6M9 16h3"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 19V5m0 14h17M8 15l4-4 3 2 5-6"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18m-13 4h3m-3 3h6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-user-plus" viewBox="0 0 24 24"><path d="M15 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m8-10a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm10-3v6m-3-3h6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14m-7-7h14"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2m6-10a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm10 10v-2a4 4 0 0 0-3-3.9m-1-12a4 4 0 0 1 0 7.8"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18m-2 0-.9 14H5.9L5 6m4 0V4h6v2m-5 4v6m4-6v6"/></symbol>
  </svg>
  <script src="/static/app.js" defer></script>
</body>
</html>
